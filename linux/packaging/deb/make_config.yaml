display_name: po0-clash
package_name: po0-clash
maintainer:
  name: yuuuki-creation
  email: 335111808+yuuuki-creation@users.noreply.github.com

priority: optional
section: x11
installed_size: 6604
essential: false
icon: ./assets/images/icon.png

dependencies:
  - libayatana-appindicator3-1
  - libsecret-1-0

# The Helper unit is written on demand by the app, not at install time, so only
# its teardown belongs here; the binary is already gone when postrm runs.
postuninstall_scripts:
  - 'case "${1:-}" in remove|purge) ;; *) exit 0 ;; esac'
  - 'systemctl disable --now po0clash-helper.service >/dev/null 2>&1 || true'
  - 'rm -f /etc/systemd/system/po0clash-helper.service'
  - 'systemctl daemon-reload >/dev/null 2>&1 || true'

supported_mime_type:
  - x-scheme-handler/clash
  - x-scheme-handler/clashmeta
  - x-scheme-handler/po0clash

keywords:
  - po0-clash
  - Clash
  - ClashMeta
  - Proxy

generic_name: po0-clash

categories:
  - Network

startup_notify: true
